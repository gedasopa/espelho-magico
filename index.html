<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Espelho Mágico das Emoções</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <style>
    body {
      text-align: center;
      font-family: "Comic Sans MS", cursive;
      transition: background-color 1s;
      margin: 0;
      padding: 0;
      background-color: #f0f8ff;
    }
    h1 {
      margin-top: 20px;
      color: #333;
    }
    video, canvas {
      border: 5px solid #444;
      border-radius: 20px;
      margin-top: 10px;
    }
    #mensagem {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      padding: 20px;
      transition: color 1s;
    }
  </style>
</head>
<body>
  <h1>🌟 Espelho Mágico das Emoções 🌟</h1>
  <video id="video" width="640" height="480" autoplay muted></video>
  <div id="mensagem">Carregando magia...</div>

  <!-- Sons -->
  <audio id="somHappy" src="https://www.myinstants.com/media/sounds/yay.mp3"></audio>
  <audio id="somSad" src="https://www.myinstants.com/media/sounds/sad-trombone.mp3"></audio>
  <audio id="somAngry" src="https://www.myinstants.com/media/sounds/angry.mp3"></audio>
  <audio id="somSurprised" src="https://www.myinstants.com/media/sounds/cartoon-surprise.mp3"></audio>
  <audio id="somNeutral" src="https://www.myinstants.com/media/sounds/pop.mp3"></audio>
  <audio id="somFearful" src="https://www.myinstants.com/media/sounds/jumpscare.mp3"></audio>
  <audio id="somDisgusted" src="https://www.myinstants.com/media/sounds/disgusted.mp3"></audio>

  <script>
    const video = document.getElementById('video');
    const mensagem = document.getElementById('mensagem');

    const mensagens = {
      happy: { texto: "Você está radiante! 🌞", cor: "#FFF9C4", som: "somHappy" },
      sad: { texto: "Tudo bem ficar triste às vezes. 💙", cor: "#BBDEFB", som: "somSad" },
      angry: { texto: "Respira fundo! 😠", cor: "#FFCDD2", som: "somAngry" },
      surprised: { texto: "Uau! Que surpresa foi essa? 😲", cor: "#E1BEE7", som: "somSurprised" },
      neutral: { texto: "Dia tranquilo por aí? 😌", cor: "#E0E0E0", som: "somNeutral" },
      fearful: { texto: "Vai dar tudo certo! 😨", cor: "#B2EBF2", som: "somFearful" },
      disgusted: { texto: "Eca! Que nojo! 😖", cor: "#DCEDC8", som: "somDisgusted" }
    };

    let ultimaEmocao = "";

    async function iniciar() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;

          video.addEventListener('play', () => {
            const canvas = faceapi.createCanvasFromMedia(video);
            document.body.append(canvas);
            const displaySize = { width: video.width, height: video.height };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
              const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
              canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

              const resized = faceapi.resizeResults(detections, displaySize);
              faceapi.draw.drawDetections(canvas, resized);

              if (detections.length > 0) {
                const expressao = detections[0].expressions;
                const emocao = Object.entries(expressao).sort((a, b) => b[1] - a[1])[0][0];

                if (emocao !== ultimaEmocao) {
                  const info = mensagens[emocao] || { texto: "Oi! 😊", cor: "#FFFFFF", som: null };
                  mensagem.innerText = info.texto;
                  document.body.style.backgroundColor = info.cor;

                  if (info.som) {
                    document.querySelectorAll("audio").forEach(a => a.pause());
                    const som = document.getElementById(info.som);
                    som.currentTime = 0;
                    som.play();
                  }

                  ultimaEmocao = emocao;
                }
              } else {
                mensagem.innerText = "Nenhum rostinho por aqui 😶";
                document.body.style.backgroundColor = "#f0f8ff";
              }
            }, 3000);
          });
        } catch (err) {
          mensagem.innerText = "❌ Permissão de câmera negada!";
        }
      } else {
        mensagem.innerText = "🚫 Navegador não suporta webcam.";
      }
    }

    iniciar();
  </script>
</body>
</html>
